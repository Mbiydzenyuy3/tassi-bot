  #       uses: appleboy/ssh-action@v1
  #       with:
  #         host: ${{ secrets.VPS_HOST }}
  #         username: ${{ secrets.VPS_USER }}
  #         key: ${{ secrets.VPS_SSH_KEY }}
  #         script: |
  #           cd /opt/tassi
  #           echo "${{ secrets.GITHUB_TOKEN }}" | \
  #             docker login ghcr.io -u "${{ github.actor }}" --password-stdin
