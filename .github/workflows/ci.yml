name: CI / CD

on:
  push:
    branches: [main, development]
  pull_request:
    branches: [main, development]

env:
  UV_VERSION: "0.11.21"
  PYTHON_VERSION: "3.12"

# Cancel in-progress runs for the same branch when a new push arrives
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Job 1: Lint & format ──────────────────────────────────────────────────
  lint:
    name: Lint & Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v4
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true

      - name: Install dev dependencies
        run: uv sync --group dev

      - name: Ruff (linter)
        run: uv run ruff check . --output-format=github

      - name: Black (format check)
        run: uv run black --check .

  # ── Job 2: Type checking ──────────────────────────────────────────────────
  type-check:
    name: Type Check (mypy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v4
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true

      - name: Install dev dependencies
        run: uv sync --group dev

      - name: mypy strict
        run: uv run mypy tassi

  # ── Job 3: Tests + coverage ───────────────────────────────────────────────
  test:
    name: Tests & Coverage
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: tassi
          POSTGRES_PASSWORD: tassi
          POSTGRES_DB: tassi
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v4
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true

      - name: Install dev dependencies
        run: uv sync --group dev

      - name: Run tests (coverage ≥ 99.98%)
        run: uv run pytest
        env:
          DATABASE_URL: postgresql+psycopg://tassi:tassi@localhost:5432/tassi
          REDIS_URL: redis://localhost:6379/0

      - name: Upload coverage report
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: coverage-xml
          path: coverage.xml
          retention-days: 7

      - name: Coverage summary in job output
        if: always()
        run: uv run coverage report --format=markdown >> $GITHUB_STEP_SUMMARY

  # ── Job 4: Docker build (+ push to GHCR on main) ─────────────────────────
  docker:
    name: Docker Build & Push
    runs-on: ubuntu-latest
    needs: [lint, type-check, test]
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build (and push on push-to-main)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name == 'push' && github.ref_name == 'main' }}
          tags: |
            ghcr.io/${{ github.repository }}:${{ github.sha }}
            ghcr.io/${{ github.repository }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # Build-time labels for traceability
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}

  # ── Job 5: Deploy to VPS (uncomment when VPS secrets are configured) ──────
